# Project Mu (無) — weekly / on-demand Chromium build for Windows and Android.
#
# A Chromium build takes ~12-20 h on GitHub's free 4-core runners, but a job
# may run at most 6 h. Each platform's build is therefore split into up to 8
# chained stages (build-stage.yml on Windows, build-stage-android.yml on
# Linux); each compiles for ~5 h and hands its half-built tree to the next as
# an artifact. The two chains run in parallel. The first stage of a chain to
# finish packages that platform, and its publish job adds it to the release.
#
# Android runs only once release signing is configured (repository secrets
# MU_ANDROID_KEYSTORE_B64, MU_ANDROID_KEY_ALIAS, MU_ANDROID_KEYSTORE_PASSWORD,
# MU_ANDROID_KEY_PASSWORD; see README). Without them, releases are Windows-only.
#
# To allow more stages, copy the last stage block of a chain, bump its number,
# move `last: true` to it, and add it to that chain's publish job `needs`.

name: Build Chromium

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chromium version, e.g. 156.0.8078.12 (leave blank for latest Stable)
        type: string
        required: false
        default: ''
  schedule:
    - cron: '23 2 * * 1'  # Mondays 02:23 UTC

permissions:
  contents: read

concurrency:
  group: build-chromium
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      android: ${{ steps.signing.outputs.android }}
    steps:
      - name: Check out Project Mu
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve Chromium version
        id: version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Diagnostics go to stderr and appear in this log; stdout is only the version.
          args=(--print-version)
          if [ -n "${WANTED:-}" ]; then args+=(--version "$WANTED"); fi
          if ! version=$(python scripts/fetch_upstream.py "${args[@]}"); then
            echo "::error::Could not resolve the Chromium version (details in the step log)"
            exit 1
          fi
          if ! git ls-remote --exit-code https://chromium.googlesource.com/chromium/src.git "refs/tags/$version" > /dev/null; then
            echo "::error::Chromium has no release tag $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Chromium $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          build=true
          if [ "$EVENT" = "schedule" ]; then
            tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
            if [[ $'\n'"$tags"$'\n' == *$'\n'"mu-$VERSION-"* ]]; then
              build=false
              echo "A release for $VERSION already exists; scheduled build skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Check Android signing
        id: signing
        env:
          KS: ${{ secrets.MU_ANDROID_KEYSTORE_B64 }}
          ALIAS: ${{ secrets.MU_ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.MU_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.MU_ANDROID_KEY_PASSWORD }}
        run: |
          # Decided here, before ~15 h of compiling, not when the APK is signed.
          if [ -n "$KS" ] && [ -n "$ALIAS" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android build skipped: release signing secrets are not set (see README)."
          fi

  stage-1:
    name: Stage 1
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      version: ${{ needs.resolve.outputs.version }}

  stage-2:
    name: Stage 2
    needs: [resolve, stage-1]
    if: needs.stage-1.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-3:
    name: Stage 3
    needs: [resolve, stage-1, stage-2]
    if: needs.stage-2.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-4:
    name: Stage 4
    needs: [resolve, stage-1, stage-3]
    if: needs.stage-3.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-5:
    name: Stage 5
    needs: [resolve, stage-1, stage-4]
    if: needs.stage-4.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-6:
    name: Stage 6
    needs: [resolve, stage-1, stage-5]
    if: needs.stage-5.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 6
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-7:
    name: Stage 7
    needs: [resolve, stage-1, stage-6]
    if: needs.stage-6.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 7
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}

  stage-8:
    name: Stage 8
    needs: [resolve, stage-1, stage-7]
    if: needs.stage-7.outputs.done == 'false'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 8
      version: ${{ needs.resolve.outputs.version }}
      workdir: ${{ needs.stage-1.outputs.workdir }}
      last: true

  # --- Android chain (Linux runners) -----------------------------------------

  android-stage-1:
    name: Android stage 1
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && needs.resolve.outputs.android == 'true'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 1
      version: ${{ needs.resolve.outputs.version }}

  android-stage-2:
    name: Android stage 2
    needs: [resolve, android-stage-1]
    if: needs.android-stage-1.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 2
      version: ${{ needs.resolve.outputs.version }}

  android-stage-3:
    name: Android stage 3
    needs: [resolve, android-stage-2]
    if: needs.android-stage-2.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 3
      version: ${{ needs.resolve.outputs.version }}

  android-stage-4:
    name: Android stage 4
    needs: [resolve, android-stage-3]
    if: needs.android-stage-3.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 4
      version: ${{ needs.resolve.outputs.version }}

  android-stage-5:
    name: Android stage 5
    needs: [resolve, android-stage-4]
    if: needs.android-stage-4.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 5
      version: ${{ needs.resolve.outputs.version }}

  android-stage-6:
    name: Android stage 6
    needs: [resolve, android-stage-5]
    if: needs.android-stage-5.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 6
      version: ${{ needs.resolve.outputs.version }}

  android-stage-7:
    name: Android stage 7
    needs: [resolve, android-stage-6]
    if: needs.android-stage-6.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 7
      version: ${{ needs.resolve.outputs.version }}

  android-stage-8:
    name: Android stage 8
    needs: [resolve, android-stage-7]
    if: needs.android-stage-7.outputs.done == 'false'
    uses: ./.github/workflows/build-stage-android.yml
    secrets: inherit
    with:
      stage: 8
      version: ${{ needs.resolve.outputs.version }}
      last: true

  # --- Publish -------------------------------------------------------------
  # One job per platform, so a failed Android build never blocks the Windows
  # release (or the other way round).

  release:
    name: Publish Windows release
    needs: [resolve, stage-1, stage-2, stage-3, stage-4, stage-5, stage-6, stage-7, stage-8]
    if: >-
      always() &&
      needs.resolve.outputs.build == 'true' &&
      contains(needs.*.outputs.done, 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Project Mu
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download browser
        uses: actions/download-artifact@v8
        with:
          name: project-mu-windows
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RUN: ${{ github.run_number }}
        run: bash scripts/publish_release.sh dist

  release-android:
    name: Publish Android release
    needs: [resolve, android-stage-1, android-stage-2, android-stage-3, android-stage-4,
            android-stage-5, android-stage-6, android-stage-7, android-stage-8]
    if: >-
      always() &&
      needs.resolve.outputs.build == 'true' &&
      contains(needs.*.outputs.done, 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Project Mu
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: project-mu-android
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RUN: ${{ github.run_number }}
        run: bash scripts/publish_release.sh dist
