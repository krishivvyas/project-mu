<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="icon" href="icons/mu-32.png">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main>
  <div class="mark">
    <svg class="enso" viewBox="0 0 200 200" aria-hidden="true">
      <path d="M150 42 A72 72 0 1 0 172 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div class="mu" aria-label="Mu">無</div>
  </div>
  <!-- Nothing is sent until Enter: no suggestions, no requests while typing. -->
  <form class="search" action="https://duckduckgo.com/" method="get" role="search" autocomplete="off">
    <input id="q" name="q" type="search" placeholder="Search privately with DuckDuckGo" aria-label="Search" spellcheck="false" autofocus>
  </form>
  <p class="line" id="line" aria-live="polite">This session returns to nothing when the window closes.</p>
</main>

<!-- Return to Mu: the inkan seal. Held down, it closes every tab and window
     and clears this session's browsing data, leaving one fresh page. -->
<button class="seal" id="seal" type="button" aria-describedby="seal-hint"
        aria-label="Return to Mu. Hold to close every tab and clear this session.">
  <span class="seal-ink" aria-hidden="true"></span>
  <span class="seal-glyph" aria-hidden="true">無</span>
</button>
<p class="hint" id="seal-hint">Hold the seal to return to Mu: every tab closes, this session is cleared</p>

<div class="impression" aria-hidden="true"><span>無</span></div>
<script src="newtab.js"></script>
</body>
</html>
